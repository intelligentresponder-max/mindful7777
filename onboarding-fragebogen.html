    en:"Trance isn't a talent, it's an everyday state: a motorway drive, a good film, the last minutes before sleep. We're only building you a route there you can take on purpose."}},
  zeit:{titel:{de:"Zeit",en:"Time"}, text:{
    de:"Zehn Minuten am Abend sind in einer Woche fast nichts — und in einem Jahr sechzig Stunden. Wir fangen mit der kleinen Zahl an, damit die große von selbst zustande kommt.",
    en:"Ten minutes an evening is almost nothing in a week — and sixty hours in a year. We start with the small number so the big one happens by itself."}},
  kosten:{titel:{de:"Kosten",en:"Cost"}, text:{
    de:"Die Frage ist weniger, was eine Session kostet, sondern was der nächste Monat in der jetzigen Lage kostet — an Schlaf, Geduld und Konzentration. Rechne beide Seiten, nicht nur eine.",
    en:"The question isn't so much what a session costs, but what another month like this costs — in sleep, patience and concentration. Count both sides, not one."}},
  wirkung:{titel:{de:"Skepsis",en:"Scepticism"}, text:{
    de:"Skepsis ist kein Hindernis, sondern eine Prüfstrategie. Deshalb steht deine Antwort auf Frage 3 im Profil: Du hast selbst festgelegt, woran du es merken willst. Daran messen wir.",
    en:"Scepticism isn't an obstacle, it's a testing strategy. That's why your answer to question 3 is in the profile: you defined how you want to notice it. That's what we measure against."}}
};

/* ---------- Ablauf ---------- */
var antworten = {}, i = -1;
var buehne = document.getElementById("buehne");
var btnW = document.getElementById("btnWeiter");
var btnZ = document.getElementById("btnZurueck");
var balken = document.getElementById("balken");
var zaehler = document.getElementById("zaehler");
var titel = document.getElementById("titel");
var untertitel = document.getElementById("untertitel");

function t(o){ return o ? (o[L] || o.de) : ""; }
function esc(x){ return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function zeile(b,s){ return '<div class="zeile"><b>'+b+'</b><span>'+esc(s)+'</span></div>'; }

function render(){
  btnZ.classList.toggle("hidden", i <= 0);
  btnZ.textContent = t(UI.zurueck);
  if(i === -1){ zeigeStart(); return; }
  if(i >= schritte.length){ zeigeErgebnis(); return; }

  var s = schritte[i];
  titel.textContent = t(UI.titelLauf);
  untertitel.textContent = t(UI.ledeLauf);
  balken.style.width = (i / schritte.length * 100) + "%";
  zaehler.textContent = t(UI.frageVon)[0] + (i+1) + t(UI.frageVon)[1] + schritte.length;
  btnW.textContent = (i === schritte.length-1) ? t(UI.erstellen) : t(UI.weiter);

  var html = '<p class="frage">'+t(s.frage)+'</p>';
  if(s.hinweis) html += '<p class="hinweis">'+t(s.hinweis)+'</p>';

  if(s.typ === "einfach" || s.typ === "mehrfach"){
    var mehr = s.typ === "mehrfach";
    var gew = antworten[s.id] || (mehr ? [] : null);
    html += '<div class="optionen">';
    s.optionen.forEach(function(o){
      var an = mehr ? gew.indexOf(o.w) > -1 : gew === o.w;
      html += '<label class="opt'+(an?' an':'')+'">'
        + '<input type="'+(mehr?'checkbox':'radio')+'" name="'+s.id+'" value="'+o.w+'"'+(an?' checked':'')+'>'
        + '<span>'+t(o.t)+(o.s?'<small>'+t(o.s)+'</small>':'')+'</span></label>';
    });
    html += '</div>';
  }
  if(s.typ === "text"){
    html += '<textarea id="freitext" placeholder="'+t(s.platzhalter)+'">'+(antworten[s.id]||"")+'</textarea>';
  }
  if(s.typ === "kontakt"){
    var k = antworten.kontakt || {};
    html += '<label class="feld" for="vorname">'+t(FELD.vorname)+'</label><input type="text" id="vorname" value="'+(k.vorname||"")+'">'
      + '<label class="feld" for="mail">'+t(FELD.mail)+'</label><input type="email" id="mail" value="'+(k.mail||"")+'">'
      + '<label class="feld" for="tel">'+t(FELD.tel)+'</label><input type="tel" id="tel" value="'+(k.tel||"")+'">'
      + '<label class="opt'+(k.ok?' an':'')+'"><input type="checkbox" id="ok"'+(k.ok?' checked':'')+'>'
      + '<span>'+t(FELD.ok)+'<small>'+t(FELD.okKlein)+'</small></span></label>';
  }
  buehne.innerHTML = html;
  bindeOptionen();
  var erstes = buehne.querySelector("textarea, input[type=text]");
  if(erstes) erstes.focus();
}

function bindeOptionen(){
  buehne.querySelectorAll(".opt input").forEach(function(inp){
    inp.addEventListener("change", function(){
      if(inp.type === "radio"){
        buehne.querySelectorAll(".opt").forEach(function(l){ l.classList.remove("an"); });
      }
      inp.closest(".opt").classList.toggle("an", inp.checked);
      if(inp.type === "checkbox" && inp.value){
        var alle = Array.prototype.slice.call(buehne.querySelectorAll(".opt input"));
        if(inp.value === "nichts" && inp.checked){
          alle.forEach(function(a){ if(a !== inp){ a.checked = false; a.closest(".opt").classList.remove("an"); } });
        } else if(inp.checked){
          alle.forEach(function(a){ if(a.value === "nichts"){ a.checked = false; a.closest(".opt").classList.remove("an"); } });
        }
      }
    });
  });
}

function sichern(){
  var s = schritte[i];
  if(!s) return true;
  if(s.typ === "einfach"){
    var g = buehne.querySelector('input[name="'+s.id+'"]:checked');
    if(!g) return false;
    antworten[s.id] = g.value;
  }
  if(s.typ === "mehrfach"){
    var m = Array.prototype.slice.call(buehne.querySelectorAll('input[name="'+s.id+'"]:checked'));
    if(!m.length) return false;
    antworten[s.id] = m.map(function(x){ return x.value; });
  }
  if(s.typ === "text"){
    var tx = buehne.querySelector("#freitext").value.trim();
    if(tx.length < 3) return false;
    antworten[s.id] = tx;
  }
  if(s.typ === "kontakt"){
    var v = buehne.querySelector("#vorname").value.trim();
    var e = buehne.querySelector("#mail").value.trim();
    if(!v || e.indexOf("@") < 1 || !buehne.querySelector("#ok").checked) return false;
    antworten.kontakt = {vorname:v, mail:e, tel:buehne.querySelector("#tel").value.trim(), ok:true};
  }
  return true;
}

function zeigeStart(){
  titel.textContent = t(UI.titelStart);
  untertitel.textContent = t(UI.ledeStart);
  balken.style.width = "0%";
  zaehler.textContent = t(UI.start);
  btnW.textContent = t(UI.losgehts);
  buehne.innerHTML = '<p class="frage">'+t(UI.startFrage)+'</p>'
    + '<p class="hinweis">'+t(UI.startText)+'</p>'
    + '<div class="karte"><h3>'+t(UI.startKarte)+'</h3>'
    + zeile(t(UI.sKanal)[0], t(UI.sKanal)[1])
    + zeile(t(UI.sRahmen)[0], t(UI.sRahmen)[1])
    + zeile(t(UI.sAntwort)[0], t(UI.sAntwort)[1])
    + '</div>';
}

function zeigeErgebnis(){
  var a = antworten, k = kanalText[a.kanal];
  balken.style.width = "100%";
  zaehler.textContent = t(UI.fertig);
  titel.textContent = t(UI.titelEnde);
  untertitel.textContent = (L === "de")
    ? a.kontakt.vorname + ", so würden wir starten."
    : a.kontakt.vorname + ", this is how we'd start.";
  btnZ.classList.remove("hidden");
  btnZ.textContent = t(UI.kopieren);

  var abklaeren = a.sicherheit.filter(function(x){ return x !== "nichts"; }).length > 0;

  var h = '<div class="spiegel">' + (L === "de"
    ? 'Du hast selbst geschrieben, woran du es merken willst: „' + esc(a.hinzu) + '“ Genau dieser Satz ist der Maßstab — und du wirst früher darauf zurückkommen, als du jetzt denkst.'
    : 'You wrote the sign yourself: “' + esc(a.hinzu) + '” That sentence is the measure — and you\'ll come back to it sooner than you think.')
    + '</div>';

  h += '<div class="karte"><h3>'+t(UI.ergTitel)+'</h3>'
    + zeile(t(UI.ergKanal), t(k.name))
    + zeile(t(UI.ergInd), t(k.tipp))
    + zeile(t(UI.ergLaenge), a.laenge + t(UI.minuten))
    + zeile(t(UI.ergRhythmus), t(fensterText[a.fenster]))
    + zeile(t(UI.ergAnsprache), t(tempoText[a.tempo]))
    + zeile(t(UI.ergThema), t(anlassText[a.anlass]))
    + '</div>';

  var offen = a.bedenken.filter(function(x){ return x !== "nichts"; });
  if(offen.length){
    h += '<div class="karte"><h3>'+t(UI.einwandTitel)+'</h3>';
    offen.forEach(function(x){
      h += '<div class="einwand"><b>'+t(einwandAntwort[x].titel)+'</b>'+t(einwandAntwort[x].text)+'</div>';
    });
    h += '</div>';
  }

  if(abklaeren){
    h += '<div class="karte achtung"><h3>'+t(UI.achtungTitel)+'</h3>'
      + '<div class="einwand">'+t(UI.achtungText)+'</div></div>';
  }

  h += '<div class="karte"><h3>'+t(UI.nextTitel)+'</h3><div class="einwand">' + (L === "de"
    ? 'Schick das Profil ab — dann bekommst du deinen Terminvorschlag und das erste ' + a.laenge + '-Minuten-Protokoll. Ob du damit schon heute ' + t(fensterText[a.fenster]) + ' anfängst oder erst nach dem Gespräch, entscheidest du dann.'
    : 'Send the profile and you\'ll get your appointment suggestion and the first ' + a.laenge + '-minute protocol. Whether you begin ' + t(fensterText[a.fenster]) + ' today or only after the call, you decide then.')
    + '</div></div>';

  buehne.innerHTML = h;
  btnW.textContent = t(UI.senden);
}

function protokoll(){
  var a = antworten;
  return [
    "Trance-Profil — mindful7777 (" + L.toUpperCase() + ")",
    "",
    "Name: " + a.kontakt.vorname,
    "E-Mail: " + a.kontakt.mail,
    "Telefon: " + (a.kontakt.tel || "—"),
    "",
    "Thema: " + t(anlassText[a.anlass]),
    "Ausgangslage: " + a.wegvon,
    "Erstes Zeichen: " + a.hinzu,
    "Kanal: " + t(kanalText[a.kanal].name),
    "Trance-Erfahrung: " + a.erfahrung,
    "Bedenken: " + a.bedenken.join(", "),
    "Vorab zu klären: " + a.sicherheit.join(", "),
    "Rhythmus: " + t(fensterText[a.fenster]),
    "Länge: " + a.laenge + " min",
    "Ansprache: " + t(tempoText[a.tempo])
  ].join("\n");
}

btnW.addEventListener("click", function(){
  if(i >= schritte.length){
    window.location.href = "mailto:" + MAIL
      + "?subject=" + encodeURIComponent("Trance-Profil " + antworten.kontakt.vorname)
      + "&body=" + encodeURIComponent(protokoll());
    return;
  }
  if(i >= 0 && !sichern()){
    btnW.textContent = t(UI.bitte);
    setTimeout(render, 1400);
    return;
  }
  i++;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
});

btnZ.addEventListener("click", function(){
  if(i >= schritte.length){
    navigator.clipboard.writeText(protokoll()).then(function(){
      btnZ.textContent = t(UI.kopiert);
      setTimeout(function(){ btnZ.textContent = t(UI.kopieren); }, 1800);
    });
    return;
  }
  sichern();
  i--;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
});

/* ---------- Sprache ---------- */
function setzeSprache(l){
  L = l;
  document.documentElement.lang = l;
  document.querySelectorAll(".langbar button").forEach(function(b){
    b.setAttribute("aria-pressed", b.dataset.set === l ? "true" : "false");
  });
  document.getElementById("fussnav").innerHTML = t(UI.fussnav).map(function(x){
    return '<a href="'+x[0]+'">'+x[1]+'</a>';
  }).join("");
  document.getElementById("fusstext").textContent = t(UI.fusstext);
  try{ history.replaceState(null, "", "?lang=" + l); }catch(e){}
  render();
}
document.querySelectorAll(".langbar button").forEach(function(b){
  b.addEventListener("click", function(){ setzeSprache(b.dataset.set); });
});
var p = new URLSearchParams(location.search).get("lang");
if(!p && (navigator.language || "").slice(0,2) === "en") p = "en";
setzeSprache(p === "en" ? "en" : "de");
</script>
</body>
</html>
